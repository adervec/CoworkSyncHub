<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Project review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ee; --surface: #fcfcfb; --surface2: #efeee8; --line: #e1e0d9; --axis: #c3c2b7;
  --text: #1b1b19; --dim: #5f5e57; --accent: #2a5db0; --on-accent: #fff;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --na: #b9b8ae;
  --good-text: #006300; --crit-text: #a82424; --warn-text: #7a5200;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121211; --surface: #1a1a19; --surface2: #242422; --line: #2c2c2a; --axis: #383835;
  --text: #ecebe6; --dim: #a3a299; --accent: #8fb4ff; --on-accent: #0b1220;
  --na: #55544e; --good-text: #3ecf3e; --crit-text: #ff8a8a; --warn-text: #fab219;
} }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 18px 0 }
header h1 { font-size: 17px; margin: 0; display: inline-block }
header .when { color: var(--dim); margin-left: 10px; font-size: 12.5px }
nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto }
nav button { font: inherit; border: 0; background: none; color: var(--dim); padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap }
nav button[aria-selected=true] { color: var(--text); border-color: var(--accent); font-weight: 600 }
nav button .n { font-size: 11.5px; background: var(--surface2); border-radius: 9px; padding: 1px 7px; margin-left: 5px }
main { padding: 16px 18px 60px; max-width: 1500px; margin: 0 auto }
section[hidden] { display: none }
h2 { font-size: 15px; margin: 22px 0 8px } h2:first-child { margin-top: 0 }
p { margin: 6px 0 } .dim { color: var(--dim) } .small { font-size: 12.5px }
a { color: var(--accent) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit }
.tile b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums }
.tile span { color: var(--dim); font-size: 12.5px }
.tile.bad b { color: var(--crit-text) } .tile.ok b { color: var(--good-text) } .tile.mid b { color: var(--warn-text) }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 6px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px }
.card h3 { margin: 0 0 6px; font-size: 14px }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 5px 10px; align-items: center }
.bars button { font: inherit; background: none; border: 0; color: var(--text); padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted }
.bar { height: 10px; background: var(--surface2); border-radius: 4px; display: flex; gap: 2px; overflow: hidden; min-width: 80px }
.bar i { display: block; height: 100% } .bar .f { background: var(--crit) } .bar .w { background: var(--warn) } .bar .o { background: var(--good) }
.num { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; white-space: nowrap }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px }
.tools input[type=search], .tools select { font: inherit; padding: 6px 9px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--text) }
.chip { font: inherit; padding: 5px 11px; border-radius: 15px; border: 1px solid var(--axis); background: var(--surface); color: var(--text); cursor: pointer }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.wrap { overflow: auto; max-height: calc(100vh - 190px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: separate; border-spacing: 0; font-size: 13px }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; vertical-align: bottom; height: 96px; cursor: pointer }
thead th span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600 }
thead th:first-child, tbody th { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1 }
thead th:first-child { z-index: 3; cursor: default }
tbody th button { font: inherit; font-weight: 600; background: none; border: 0; color: var(--text); cursor: pointer; padding: 0; text-decoration: underline dotted }
tbody tr:hover th, tbody tr:hover td { background: var(--surface2) }
.c { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; border: 0; color: #fff }
.c.ok { background: var(--good) } .c.warn { background: var(--warn); color: #0b0b0b } .c.FAIL { background: var(--crit) }
.c.na { background: none; color: var(--na) } .c.q { background: var(--serious); color: #0b0b0b }
.c:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600 }
.st.FAIL { color: var(--crit-text) } .st.warn { color: var(--warn-text) } .st.ok { color: var(--good-text) } .st.na { color: var(--dim) }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; padding: 0 14px }
.proj > summary { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 0; cursor: pointer; list-style: none }
.proj > summary::-webkit-details-marker { display: none }
.proj > summary b { font-size: 15px; min-width: 190px }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 9px; background: var(--surface2); color: var(--dim); white-space: nowrap }
.tag.bad { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit-text); font-weight: 600 }
.tag.mid { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn-text); font-weight: 600 }
.tag.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); font-weight: 600 }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 4px 0 10px }
.kv dt { color: var(--dim) } .kv dd { margin: 0; overflow-wrap: anywhere }
ul.gaps { list-style: none; padding: 0; margin: 4px 0 12px }
ul.gaps li { padding: 5px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 120px 1fr; gap: 10px }
ul.gaps li button { font: inherit; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; text-align: left; text-decoration: underline dotted }
.std { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; padding: 0 14px }
.std > summary { display: grid; grid-template-columns: 34px 1fr 150px max-content; gap: 10px; align-items: center; padding: 10px 0; cursor: pointer; list-style: none }
.std > summary::-webkit-details-marker { display: none }
.std pre { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--surface2); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto }
table.plain { width: 100%; font-size: 13px } table.plain th, table.plain td { text-align: left; white-space: normal; vertical-align: top; position: static; height: auto; cursor: default }
table.plain thead th { position: static; height: auto }
#panel { position: fixed; right: 14px; bottom: 14px; width: min(440px, calc(100vw - 28px)); background: var(--surface); border: 1px solid var(--axis); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 9 }
#panel[hidden] { display: none } #panel h3 { margin: 0 26px 4px 0; font-size: 14px } #panel .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--dim); font-size: 18px; cursor: pointer }
#panel p { overflow-wrap: anywhere }
.todo li { margin: 4px 0 }
.empty { color: var(--dim); padding: 14px 0 }
</style></head><body>
<header><h1>Project review</h1><span class="when" id="when"></span>
<nav role="tablist" id="nav"></nav></header>
<main>
<section id="t-overview"></section>
<section id="t-matrix" hidden></section>
<section id="t-projects" hidden></section>
<section id="t-standards" hidden></section>
<section id="t-leaks" hidden></section>
<section id="t-overlaps" hidden></section>
<section id="t-roadmap" hidden></section>
</main>
<div id="panel" hidden><button class="x" aria-label="Close">×</button><h3></h3><div id="panelBody"></div></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, text, cls) { var x = document.createElement(tag); if (text != null) x.textContent = text; if (cls) x.className = cls; return x; };
  var GLYPH = { ok: '✓', warn: '!', FAIL: '✕', '-': '–', '?': '?' }, WORD = { ok: 'ok', warn: 'warning', FAIL: 'fails', '-': 'not applicable', '?': 'unknown' };
  var cls = function (s) { return s === '-' ? 'na' : s === '?' ? 'q' : s; };
  var keys = D.checks.map(function (c) { return c[0]; }), label = {};
  D.checks.forEach(function (c) { label[c[0]] = c[1]; });
  var cell = function (p, k) { return (p.cells && p.cells[k]) || ['-', '']; };
  var count = function (p, s) { return keys.filter(function (k) { return cell(p, k)[0] === s; }).length; };
  var colCount = function (k, s) { return D.projects.filter(function (p) { return cell(p, k)[0] === s; }).length; };
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  var mem = function (k, v) { try { if (v === undefined) return localStorage.getItem('review-' + k); localStorage.setItem('review-' + k, v); } catch (e) { return null; } };
  var st = function (s) { var x = el('span', GLYPH[s] + ' ' + WORD[s], 'st ' + cls(s)); return x; };

  // ---- the detail panel (what a cell, a tile or a finding means) ----
  function panel(title, build) {
    $('panel').hidden = false; $('panel').querySelector('h3').textContent = title;
    var b = $('panelBody'); b.textContent = ''; build(b);
  }
  $('panel').querySelector('.x').addEventListener('click', function () { $('panel').hidden = true; });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') $('panel').hidden = true; });
  function showCell(p, k) {
    var c = cell(p, k);
    panel(p.title + ' · ' + k, function (b) {
      b.appendChild(el('p', label[k], 'dim'));
      b.appendChild(st(c[0]));
      if (c[1]) b.appendChild(el('p', c[1]));
      var row = el('p');
      var a = el('button', 'Open project', 'chip'); a.addEventListener('click', function () { go('projects', p.slug); });
      var s = el('button', 'Open standard', 'chip'); s.addEventListener('click', function () { go('standards', k); });
      row.append(a, ' ', s); b.appendChild(row);
    });
  }

  // ---- tabs ----
  var TABS = [['overview', 'Overview'], ['matrix', 'Matrix'], ['projects', 'Projects'], ['standards', 'Standards'], ['leaks', 'Leaks'], ['overlaps', 'Overlaps'], ['roadmap', 'Roadmap and decisions']];
  var built = {}, focus = null;
  function go(tab, target) {
    focus = target || null;
    TABS.forEach(function (t) {
      $('t-' + t[0]).hidden = t[0] !== tab;
      $('nav').querySelector('[data-tab=' + t[0] + ']').setAttribute('aria-selected', String(t[0] === tab));
    });
    if (!built[tab]) { BUILD[tab]($('t-' + tab)); built[tab] = true; }
    if (focus) { var d = document.getElementById(tab + '-' + focus); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); window.scrollBy(0, -90); } }
    try { history.replaceState(null, '', '#' + tab + (focus ? '/' + focus : '')); } catch (e) { /* file:// in some browsers */ }
    $('panel').hidden = true;
  }
  var totalFail = 0, totalWarn = 0;
  D.projects.forEach(function (p) { totalFail += count(p, 'FAIL'); totalWarn += count(p, 'warn'); });
  var leakTotal = 0; Object.keys(D.leaks).forEach(function (k) { leakTotal += D.leaks[k].length; });
  var badge = { matrix: totalFail, projects: D.projects.length, standards: D.standards.length, leaks: leakTotal, overlaps: D.overlaps.length };
  TABS.forEach(function (t) {
    var b = el('button', t[1]); b.dataset.tab = t[0]; b.setAttribute('role', 'tab');
    if (badge[t[0]] != null) b.appendChild(el('span', String(badge[t[0]]), 'n'));
    b.addEventListener('click', function () { go(t[0]); });
    $('nav').appendChild(b);
  });
  $('when').textContent = 'generated ' + new Date(D.generated).toLocaleString() + ' · local file, not published';

  var BUILD = {};

  // ---- overview ----
  BUILD.overview = function (box) {
    var dirty = D.projects.filter(function (p) { return p.git && (p.git.dirty || p.git.unpushed); });
    var ciBad = D.projects.filter(function (p) { return p.ci === 'FAIL'; }), down = D.projects.filter(function (p) { return p.live && p.live !== '200' && p.live !== '-'; });
    var tiles = el('div', null, 'tiles');
    [[D.projects.length, 'projects', '', 'projects'], [totalFail, 'failing checks', totalFail ? 'bad' : 'ok', 'matrix'], [totalWarn, 'warnings', totalWarn ? 'mid' : 'ok', 'matrix'],
      [leakTotal, 'leak findings', leakTotal ? 'bad' : 'ok', 'leaks'], [ciBad.length, 'repos with failing CI', ciBad.length ? 'bad' : 'ok', 'projects'],
      [down.length, 'live sites not answering', down.length ? 'bad' : 'ok', 'projects'], [dirty.length, 'repos with uncommitted or unpushed work', dirty.length ? 'mid' : 'ok', 'projects'],
      [D.overlaps.length, 'overlaps noted', '', 'overlaps']].forEach(function (t) {
      var b = el('button', null, 'tile ' + t[2]); b.appendChild(el('b', String(t[0]))); b.appendChild(el('span', t[1]));
      b.addEventListener('click', function () { go(t[3]); }); tiles.appendChild(b);
    });
    box.appendChild(tiles);
    var cols = el('div', null, 'cols');
    var c1 = el('div', null, 'card'); c1.appendChild(el('h3', 'Projects by gaps'));
    var bars = el('div', null, 'bars');
    D.projects.slice().sort(function (a, b) { return count(b, 'FAIL') - count(a, 'FAIL') || count(b, 'warn') - count(a, 'warn'); }).forEach(function (p) {
      var f = count(p, 'FAIL'), w = count(p, 'warn'), o = count(p, 'ok'), n = f + w + o || 1;
      var nm = el('button', p.title); nm.addEventListener('click', function () { go('projects', p.slug); });
      var bar = el('div', null, 'bar'); bar.title = f + ' failing, ' + w + ' warnings, ' + o + ' ok';
      [['f', f], ['w', w], ['o', o]].forEach(function (x) { if (x[1]) { var i = el('i', null, x[0]); i.style.width = (100 * x[1] / n) + '%'; bar.appendChild(i); } });
      bars.append(nm, bar, el('span', f + ' ✕  ' + w + ' !', 'num'));
    });
    c1.appendChild(bars); cols.appendChild(c1);
    var c2 = el('div', null, 'card'); c2.appendChild(el('h3', 'Standards by how many projects fall short'));
    var bars2 = el('div', null, 'bars');
    keys.slice().sort(function (a, b) { return colCount(b, 'FAIL') - colCount(a, 'FAIL') || colCount(b, 'warn') - colCount(a, 'warn'); }).filter(function (k) { return colCount(k, 'FAIL') + colCount(k, 'warn'); }).forEach(function (k) {
      var f = colCount(k, 'FAIL'), w = colCount(k, 'warn'), o = colCount(k, 'ok'), n = f + w + o || 1;
      var nm = el('button', k); nm.title = label[k]; nm.addEventListener('click', function () { go('standards', k); });
      var bar = el('div', null, 'bar'); bar.title = label[k] + ': ' + f + ' failing, ' + w + ' warnings, ' + o + ' ok';
      [['f', f], ['w', w], ['o', o]].forEach(function (x) { if (x[1]) { var i = el('i', null, x[0]); i.style.width = (100 * x[1] / n) + '%'; bar.appendChild(i); } });
      bars2.append(nm, bar, el('span', f + ' ✕  ' + w + ' !', 'num'));
    });
    if (!bars2.children.length) bars2.appendChild(el('span', 'Every standard is met everywhere.', 'dim'));
    c2.appendChild(bars2); c2.appendChild(el('p', 'Red = fails, yellow = warning, green = ok. Hover a bar for the numbers.', 'dim small')); cols.appendChild(c2);
    var c3 = el('div', null, 'card'); c3.appendChild(el('h3', 'Waiting on you'));
    var ul = el('ul', null, 'todo'); (D.notes.waiting || []).forEach(function (w) { ul.appendChild(el('li', w)); });
    if (!ul.children.length) ul.appendChild(el('li', 'Nothing recorded.', 'dim'));
    c3.appendChild(ul);
    var more = el('button', 'Roadmap and open decisions', 'chip'); more.addEventListener('click', function () { go('roadmap'); }); c3.appendChild(more);
    cols.appendChild(c3);
    box.appendChild(cols);
  };

  // ---- matrix ----
  BUILD.matrix = function (box) {
    var show = mem('show') || 'all', sort = mem('sort') || 'gaps', q = '', hideGreen = mem('hidegreen') === '1';
    var tools = el('div', null, 'tools'), search = el('input'); search.type = 'search'; search.placeholder = 'Filter projects…'; search.setAttribute('aria-label', 'Filter projects');
    var chips = {};
    [['all', 'Everything'], ['FAIL', 'Only failing'], ['gaps', 'Failing and warnings']].forEach(function (c) {
      var b = el('button', c[1], 'chip'); b.addEventListener('click', function () { show = c[0]; mem('show', show); draw(); }); chips[c[0]] = b; tools.appendChild(b);
    });
    var hg = el('button', 'Hide all-green columns', 'chip'); hg.addEventListener('click', function () { hideGreen = !hideGreen; mem('hidegreen', hideGreen ? '1' : '0'); draw(); });
    var sel = el('select'); sel.setAttribute('aria-label', 'Sort projects'); [['gaps', 'Most gaps first'], ['name', 'A to Z']].forEach(function (o) { var x = el('option', o[1]); x.value = o[0]; sel.appendChild(x); });
    sel.value = sort; sel.addEventListener('change', function () { sort = sel.value; mem('sort', sort); draw(); });
    search.addEventListener('input', function () { q = search.value.toLowerCase(); draw(); });
    tools.append(hg, sel, search); box.appendChild(tools);
    box.appendChild(el('p', '✓ ok · ! warning · ✕ fails · ? unknown · – not applicable. Click a cell for the reason, a project name for the project, a column heading for the standard.', 'dim small'));
    var wrap = el('div', null, 'wrap'); box.appendChild(wrap);
    function draw() {
      Object.keys(chips).forEach(function (k) { chips[k].setAttribute('aria-pressed', String(k === show)); }); hg.setAttribute('aria-pressed', String(hideGreen));
      var cols = keys.filter(function (k) { return !hideGreen || colCount(k, 'FAIL') + colCount(k, 'warn') + colCount(k, '?') > 0; });
      var rows = D.projects.filter(function (p) { return (!q || (p.title + ' ' + p.slug).toLowerCase().indexOf(q) >= 0) && (show === 'all' || count(p, 'FAIL') || (show === 'gaps' && count(p, 'warn'))); });
      rows.sort(function (a, b) { return sort === 'name' ? a.title.localeCompare(b.title) : count(b, 'FAIL') - count(a, 'FAIL') || count(b, 'warn') - count(a, 'warn') || a.title.localeCompare(b.title); });
      var t = el('table'), h = el('tr'); h.appendChild(el('th', 'Project'));
      cols.forEach(function (k) { var th = el('th'); th.title = label[k]; th.appendChild(el('span', k)); th.addEventListener('click', function () { go('standards', k); }); h.appendChild(th); });
      var th2 = el('th'); th2.appendChild(el('span', 'failing')); h.appendChild(th2);
      var thead = el('thead'); thead.appendChild(h); t.appendChild(thead);
      var tb = el('tbody');
      rows.forEach(function (p) {
        var tr = el('tr'), th = el('th'), nb = el('button', p.title); nb.addEventListener('click', function () { go('projects', p.slug); }); th.appendChild(nb); tr.appendChild(th);
        cols.forEach(function (k) {
          var c = cell(p, k), td = el('td');
          if (show !== 'all' && c[0] !== 'FAIL' && !(show === 'gaps' && c[0] === 'warn')) { td.appendChild(el('span', '·', 'dim')); tr.appendChild(td); return; }
          var b = el('button', GLYPH[c[0]] || '?', 'c ' + cls(c[0])); b.title = p.title + ' · ' + k + ': ' + WORD[c[0]] + (c[1] ? ' — ' + c[1] : '');
          b.setAttribute('aria-label', b.title); b.addEventListener('click', function () { showCell(p, k); }); td.appendChild(b); tr.appendChild(td);
        });
        tr.appendChild(el('td', String(count(p, 'FAIL')), 'num')); tb.appendChild(tr);
      });
      t.appendChild(tb); wrap.textContent = ''; wrap.appendChild(rows.length ? t : el('p', 'No project matches.', 'empty'));
    }
    draw();
  };

  // ---- projects ----
  BUILD.projects = function (box) {
    var q = '', tools = el('div', null, 'tools'), search = el('input'); search.type = 'search'; search.placeholder = 'Filter projects…'; search.setAttribute('aria-label', 'Filter projects');
    search.addEventListener('input', function () { q = search.value.toLowerCase(); draw(); }); tools.appendChild(search); box.appendChild(tools);
    var list = el('div'); box.appendChild(list);
    function draw() {
      list.textContent = '';
      D.projects.filter(function (p) { return !q || (p.title + ' ' + p.slug + ' ' + (p.kind || '')).toLowerCase().indexOf(q) >= 0; }).forEach(function (p) {
        var d = el('details', null, 'proj'), s = el('summary'), f = count(p, 'FAIL'), w = count(p, 'warn'), g = p.git || {};
        d.id = 'projects-' + p.slug;
        s.appendChild(el('b', p.title));
        s.appendChild(el('span', f ? plural(f, 'failing check') : 'no failing checks', 'tag ' + (f ? 'bad' : 'ok')));
        if (w) s.appendChild(el('span', plural(w, 'warning'), 'tag mid'));
        if ((D.leaks[p.dir] || []).length) s.appendChild(el('span', plural(D.leaks[p.dir].length, 'leak finding'), 'tag bad'));
        if (p.ci && p.ci !== '-') s.appendChild(el('span', 'CI ' + p.ci, 'tag ' + (p.ci === 'FAIL' ? 'bad' : p.ci === 'ok' ? 'ok' : '')));
        if (p.live && p.live !== '-') s.appendChild(el('span', 'live ' + p.live, 'tag ' + (p.live === '200' ? 'ok' : 'bad')));
        if (!p.registered) s.appendChild(el('span', 'not on the hub yet', 'tag'));
        if (p.visibility) s.appendChild(el('span', p.visibility.toLowerCase(), 'tag'));
        if (g.dirty) s.appendChild(el('span', plural(g.dirty, 'uncommitted file'), 'tag mid'));
        if (g.unpushed) s.appendChild(el('span', plural(g.unpushed, 'unpushed commit'), 'tag mid'));
        d.appendChild(s);
        var kv = el('dl', null, 'kv');
        [['What it is', p.tagline], ['Kind', p.kind], ['Folder', p.dir], ['Live site', p.url], ['Branch', g.branch], ['Last commit', g.last ? new Date(g.last).toLocaleString() + ' · ' + (g.subject || '') : ''],
          ['Stars and forks', p.stars != null ? p.stars + ' stars, ' + p.forks + ' forks' : ''], ['Repo visits, last 14 days', p.views ? p.views[0] + ' views by ' + plural(p.views[1], 'visitor') + '; ' + p.clones[0] + ' clones by ' + plural(p.clones[1], 'cloner') + ' (GitHub gives counts, never names)' : ''],
          ['Standards', count(p, 'ok') + ' ok, ' + w + ' warnings, ' + f + ' failing, ' + count(p, '-') + ' not applicable']].forEach(function (r) {
          if (!r[1]) return; kv.appendChild(el('dt', r[0]));
          var dd = el('dd'); if (r[0] === 'Live site') { var a = el('a', r[1]); a.href = r[1]; a.target = '_blank'; a.rel = 'noopener'; dd.appendChild(a); } else dd.textContent = r[1]; kv.appendChild(dd);
        });
        d.appendChild(kv);
        var gaps = keys.filter(function (k) { var x = cell(p, k)[0]; return x === 'FAIL' || x === 'warn' || x === '?'; });
        d.appendChild(el('h3', gaps.length ? 'Gaps' : 'No gaps against the standards'));
        var ul = el('ul', null, 'gaps');
        gaps.sort(function (a, b) { return (cell(p, a)[0] === 'FAIL' ? 0 : 1) - (cell(p, b)[0] === 'FAIL' ? 0 : 1); }).forEach(function (k) {
          var li = el('li'), left = el('div'), kb = el('button', k); kb.title = label[k]; kb.addEventListener('click', function () { go('standards', k); });
          left.append(st(cell(p, k)[0]), el('br'), kb); li.append(left, el('div', cell(p, k)[1] || label[k])); ul.appendChild(li);
        });
        d.appendChild(ul);
        var lk = D.leaks[p.dir] || [];
        if (lk.length) { d.appendChild(el('h3', 'Leak findings')); var ul2 = el('ul', null, 'gaps'); lk.forEach(function (x) { var li = el('li'); li.append(el('div', x.kind, 'dim'), el('div', x.where + ' ← ' + x.what)); ul2.appendChild(li); }); d.appendChild(ul2); }
        var ov = D.overlaps.filter(function (o) { return o.who.indexOf(p.title) >= 0 || o.who.indexOf(p.slug) >= 0 || /every app/.test(o.who); });
        if (ov.length) { d.appendChild(el('h3', 'Overlaps that name this project')); var ul3 = el('ul', null, 'gaps'); ov.forEach(function (o) { var li = el('li'); li.append(el('div', o.state, 'dim'), el('div', o.who + ': ' + o.what)); ul3.appendChild(li); }); d.appendChild(ul3); }
        list.appendChild(d);
      });
      if (!list.children.length) list.appendChild(el('p', 'No project matches.', 'empty'));
      if (focus) { var t = document.getElementById('projects-' + focus); if (t) t.open = true; }
    }
    draw();
  };

  // ---- standards ----
  BUILD.standards = function (box) {
    box.appendChild(el('p', 'Each house standard, the check columns that enforce it, and who falls short. A standard with no column is checked by hand or by its own tool.', 'dim small'));
    D.standards.forEach(function (s) {
      var d = el('details', null, 'std'), sum = el('summary'), f = 0, w = 0, o = 0;
      s.checks.forEach(function (k) { f += colCount(k, 'FAIL'); w += colCount(k, 'warn'); o += colCount(k, 'ok'); });
      sum.appendChild(el('b', String(s.n))); sum.appendChild(el('span', s.title));
      var bar = el('div', null, 'bar'), n = f + w + o;
      if (n) [['f', f], ['w', w], ['o', o]].forEach(function (x) { if (x[1]) { var i = el('i', null, x[0]); i.style.width = (100 * x[1] / n) + '%'; bar.appendChild(i); } });
      bar.title = n ? f + ' failing, ' + w + ' warnings, ' + o + ' ok across ' + s.checks.join(', ') : 'no check column';
      sum.appendChild(bar);
      sum.appendChild(el('span', n ? (f ? f + ' ✕' : '') + (w ? '  ' + w + ' !' : '') + (!f && !w ? 'all ok' : '') : 'no column', 'num'));
      d.appendChild(sum);
      s.checks.forEach(function (k) {
        var a = el('div'); a.id = 'standards-' + k;
        d.appendChild(a);
        d.appendChild(el('h3', k + ' — ' + label[k]));
        var bad = D.projects.filter(function (p) { var x = cell(p, k)[0]; return x === 'FAIL' || x === 'warn' || x === '?'; });
        if (!bad.length) { d.appendChild(el('p', 'Every project passes.', 'dim')); return; }
        var ul = el('ul', null, 'gaps');
        bad.forEach(function (p) { var li = el('li'), left = el('div'), pb = el('button', p.title); pb.addEventListener('click', function () { go('projects', p.slug); }); left.append(pb, el('br'), st(cell(p, k)[0])); li.append(left, el('div', cell(p, k)[1] || '')); ul.appendChild(li); });
        d.appendChild(ul);
      });
      var t = el('details'); t.appendChild(el('summary', 'The standard, in full')); t.appendChild(el('pre', s.text)); d.appendChild(t);
      d.appendChild(el('p', ''));
      box.appendChild(d);
    });
    if (focus) { var a = document.getElementById('standards-' + focus); if (a) { a.parentNode.open = true; a.scrollIntoView(); window.scrollBy(0, -100); } }
  };

  // ---- leaks ----
  BUILD.leaks = function (box) {
    box.appendChild(el('p', 'Personal data that git tracks, or that a repo\'s history still holds (house standard 26). Public repos matter most.', 'dim small'));
    var t = el('table', null, 'plain'), h = el('tr'); ['Project', 'Repo', 'Kind', 'Where', 'What'].forEach(function (x) { h.appendChild(el('th', x)); });
    var th = el('thead'); th.appendChild(h); t.appendChild(th); var tb = el('tbody');
    Object.keys(D.leaks).forEach(function (dir) {
      var p = D.projects.filter(function (x) { return x.dir === dir; })[0];
      D.leaks[dir].forEach(function (x) { var tr = el('tr'); [p ? p.title : dir, p && p.visibility ? p.visibility.toLowerCase() : '', x.kind, x.where, x.what].forEach(function (v) { tr.appendChild(el('td', v)); }); tb.appendChild(tr); });
    });
    t.appendChild(tb);
    var w = el('div', null, 'wrap'); w.appendChild(leakTotal ? t : el('p', 'Nothing found in any repo.', 'empty')); box.appendChild(w);
    box.appendChild(el('p', D.neverList ? 'Your private never-publish list is in use (' + plural(D.neverList, 'string') + ').' : 'No private never-publish list yet (~/.adervec-runner/never-publish.txt).', 'dim small'));
  };

  // ---- overlaps ----
  BUILD.overlaps = function (box) {
    var state = 'all', q = '', tools = el('div', null, 'tools'), chips = {};
    ['all', 'planned', 'idea', 'done', 'dropped'].forEach(function (s) {
      var n = s === 'all' ? D.overlaps.length : D.overlaps.filter(function (o) { return o.state === s; }).length;
      var b = el('button', (s === 'all' ? 'Everything' : s) + ' (' + n + ')', 'chip'); b.addEventListener('click', function () { state = s; draw(); }); chips[s] = b; tools.appendChild(b);
    });
    var search = el('input'); search.type = 'search'; search.placeholder = 'Filter by app or word…'; search.setAttribute('aria-label', 'Filter overlaps');
    search.addEventListener('input', function () { q = search.value.toLowerCase(); draw(); }); tools.appendChild(search); box.appendChild(tools);
    box.appendChild(el('p', 'Noticed, not decided (house standard 27). Nothing here is being built unless its state is "planned".', 'dim small'));
    var w = el('div', null, 'wrap'); box.appendChild(w);
    function draw() {
      Object.keys(chips).forEach(function (k) { chips[k].setAttribute('aria-pressed', String(k === state)); });
      var t = el('table', null, 'plain'), h = el('tr'); ['State', 'Who', 'What overlaps, and what could be shared', 'Noted by'].forEach(function (x) { h.appendChild(el('th', x)); });
      var th = el('thead'); th.appendChild(h); t.appendChild(th); var tb = el('tbody');
      D.overlaps.filter(function (o) { return (state === 'all' || o.state === state) && (!q || (o.who + ' ' + o.what).toLowerCase().indexOf(q) >= 0); }).forEach(function (o) {
        var tr = el('tr'); [o.state, o.who, o.what, o.source].forEach(function (v) { tr.appendChild(el('td', v)); }); tb.appendChild(tr);
      });
      t.appendChild(tb); w.textContent = ''; w.appendChild(tb.children.length ? t : el('p', 'Nothing matches.', 'empty'));
    }
    draw();
  };

  // ---- roadmap and decisions ----
  BUILD.roadmap = function (box) {
    var N = D.notes;
    box.appendChild(el('h2', 'Hub roadmap'));
    var t = el('table', null, 'plain'), tb = el('tbody');
    (N.roadmap || []).forEach(function (r) { var tr = el('tr'); tr.appendChild(el('td', r[0])); var s = el('td'); s.appendChild(el('span', r[1], 'tag ' + (r[1] === 'done' ? 'ok' : r[1] === 'blocked' ? 'bad' : r[1] === 'in progress' ? 'mid' : ''))); tr.appendChild(s); tr.appendChild(el('td', r[2])); tb.appendChild(tr); });
    t.appendChild(tb); var w = el('div', null, 'wrap'); w.style.maxHeight = 'none'; w.appendChild(t); box.appendChild(w);
    [['Decisions waiting on you', N.decisions], ['Waiting on you (actions)', N.waiting], ['Decided', N.decided], ['Not yet tried by a person', N.untested]].forEach(function (g) {
      box.appendChild(el('h2', g[0])); var ul = el('ul', null, 'todo'); (g[1] || []).forEach(function (x) { ul.appendChild(el('li', x)); });
      if (!ul.children.length) ul.appendChild(el('li', 'Nothing recorded.', 'dim')); box.appendChild(ul);
    });
    box.appendChild(el('p', 'This tab is kept by the QA lead session in _review/notes.json; the other tabs are read from the repos each time the page is generated.', 'dim small'));
  };

  var h = (location.hash || '#overview').slice(1).split('/');
  go(TABS.some(function (t) { return t[0] === h[0]; }) ? h[0] : 'overview', h[1]);
})();
</script>
