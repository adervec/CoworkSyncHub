<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Project review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ee; --surface: #fcfcfb; --surface2: #efeee8; --line: #e1e0d9; --axis: #c3c2b7;
  --text: #1b1b19; --dim: #5f5e57; --accent: #2a5db0; --on-accent: #fff;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --na: #b9b8ae;
  --good-text: #006300; --crit-text: #a82424; --warn-text: #7a5200;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121211; --surface: #1a1a19; --surface2: #242422; --line: #2c2c2a; --axis: #383835;
  --text: #ecebe6; --dim: #a3a299; --accent: #8fb4ff; --on-accent: #0b1220;
  --na: #55544e; --good-text: #3ecf3e; --crit-text: #ff8a8a; --warn-text: #fab219;
} }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 18px 0 }
header h1 { font-size: 17px; margin: 0; display: inline-block }
header .when { color: var(--dim); margin-left: 10px; font-size: 12.5px }
nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto }
nav button { font: inherit; border: 0; background: none; color: var(--dim); padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap }
nav button[aria-selected=true] { color: var(--text); border-color: var(--accent); font-weight: 600 }
nav button .n { font-size: 11.5px; background: var(--surface2); border-radius: 9px; padding: 1px 7px; margin-left: 5px }
main { padding: 16px 18px 60px; max-width: 1500px; margin: 0 auto }
section[hidden] { display: none }
h2 { font-size: 15px; margin: 22px 0 8px } h2:first-child { margin-top: 0 }
h3 { font-size: 14px; margin: 12px 0 4px }
p { margin: 6px 0 } .dim { color: var(--dim) } .small { font-size: 12.5px }
a { color: var(--accent) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit }
.tile b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums }
.tile span { color: var(--dim); font-size: 12.5px; display: block }
.tile.bad b { color: var(--crit-text) } .tile.ok b { color: var(--good-text) } .tile.mid b { color: var(--warn-text) }
.tile .delta { font-size: 12px; font-weight: 600 } .delta.down { color: var(--good-text) } .delta.up { color: var(--crit-text) }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0 }
.card h3 { margin: 0 0 6px }
.card.wide { grid-column: 1 / -1 }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 5px 10px; align-items: center }
.link { font: inherit; background: none; border: 0; color: var(--text); padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted }
.bar { height: 10px; background: var(--surface2); border-radius: 4px; display: flex; gap: 2px; overflow: hidden; min-width: 80px }
.bar i { display: block; height: 100% } .bar .f { background: var(--crit) } .bar .w { background: var(--warn) } .bar .o { background: var(--good) }
.num { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; white-space: nowrap }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px }
.tools input[type=search], .tools select { font: inherit; padding: 6px 9px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--text) }
.tools .sep { width: 1px; align-self: stretch; background: var(--line) }
.chip { font: inherit; padding: 5px 11px; border-radius: 15px; border: 1px solid var(--axis); background: var(--surface); color: var(--text); cursor: pointer }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.wrap { overflow: auto; max-height: calc(100vh - 190px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: separate; border-spacing: 0; font-size: 13px }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap }
table.matrix thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; vertical-align: bottom; height: 96px; cursor: pointer }
table.matrix thead th span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600 }
table.matrix thead th.sorted span { color: var(--accent); text-decoration: underline }
table.matrix thead th:first-child, table.matrix tbody th { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1 }
table.matrix thead th:first-child { z-index: 3; cursor: default }
table.matrix tbody tr:hover th, table.matrix tbody tr:hover td { background: var(--surface2) }
.c { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; border: 0; color: #fff }
.c.ok { background: var(--good) } .c.warn { background: var(--warn); color: #0b0b0b } .c.FAIL { background: var(--crit) }
.c.na { background: none; color: var(--na) } .c.q { background: var(--serious); color: #0b0b0b }
.c:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap }
.st.FAIL, .st.p1 { color: var(--crit-text) } .st.warn, .st.p3 { color: var(--warn-text) } .st.ok { color: var(--good-text) } .st.na, .st.p4 { color: var(--dim) } .st.p2 { color: var(--text) }
.proj, .std { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; padding: 0 14px }
.proj > summary { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 0; cursor: pointer; list-style: none }
.proj > summary::-webkit-details-marker, .std > summary::-webkit-details-marker { display: none }
.proj > summary b { font-size: 15px; min-width: 190px }
.proj > summary .next { flex-basis: 100%; color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 9px; background: var(--surface2); color: var(--dim); white-space: nowrap }
.tag.bad { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit-text); font-weight: 600 }
.tag.mid { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn-text); font-weight: 600 }
.tag.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-text); font-weight: 600 }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 4px 0 10px }
.kv dt { color: var(--dim) } .kv dd { margin: 0; overflow-wrap: anywhere }
ul.gaps { list-style: none; padding: 0; margin: 4px 0 12px }
ul.gaps li { padding: 5px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 130px 1fr; gap: 10px; overflow-wrap: anywhere }
.std > summary { display: grid; grid-template-columns: 34px 1fr 150px max-content; gap: 10px; align-items: center; padding: 10px 0; cursor: pointer; list-style: none }
.std pre { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--surface2); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto }
table.plain { width: 100%; font-size: 13px } table.plain th, table.plain td { text-align: left; white-space: normal; vertical-align: top; overflow-wrap: anywhere }
table.plain th { position: sticky; top: 0; background: var(--surface); cursor: pointer; white-space: nowrap } table.plain th.sorted { color: var(--accent) }
table.plain td.nowrap { white-space: nowrap }
#panel { position: fixed; right: 14px; bottom: 14px; width: min(440px, calc(100vw - 28px)); background: var(--surface); border: 1px solid var(--axis); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 9 }
#panel[hidden] { display: none } #panel h3 { margin: 0 26px 4px 0 } #panel .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--dim); font-size: 18px; cursor: pointer }
#panel p { overflow-wrap: anywhere }
.todo li { margin: 4px 0 }
.empty { color: var(--dim); padding: 14px }
svg.trend { width: 100%; height: 70px; display: block } svg.trend polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round } svg.trend circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2 }
svg.trend line { stroke: var(--line) }
</style></head><body>
<header><h1>Project review</h1><span class="when" id="when"></span>
<nav role="tablist" id="nav"></nav></header>
<main>
<section id="t-overview"></section><section id="t-todo" hidden></section><section id="t-matrix" hidden></section><section id="t-projects" hidden></section>
<section id="t-standards" hidden></section><section id="t-leaks" hidden></section><section id="t-overlaps" hidden></section><section id="t-roadmap" hidden></section>
</main>
<div id="panel" hidden><button class="x" aria-label="Close">×</button><h3></h3><div id="panelBody"></div></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, text, cls) { var x = document.createElement(tag); if (text != null) x.textContent = text; if (cls) x.className = cls; return x; };
  var GLYPH = { ok: '✓', warn: '!', FAIL: '✕', '-': '–', '?': '?' }, WORD = { ok: 'ok', warn: 'warning', FAIL: 'fails', '-': 'not applicable', '?': 'unknown' };
  var PRI = { 1: 'urgent', 2: 'gap', 3: 'loose end', 4: 'someday' }, PGLYPH = { 1: '‼', 2: '✕', 3: '!', 4: '·' };
  var cls = function (s) { return s === '-' ? 'na' : s === '?' ? 'q' : s; };
  var keys = D.checks.map(function (c) { return c[0]; }), label = {};
  D.checks.forEach(function (c) { label[c[0]] = c[1]; });
  var cell = function (p, k) { return (p.cells && p.cells[k]) || ['-', '']; };
  var count = function (p, s) { return keys.filter(function (k) { return cell(p, k)[0] === s; }).length; };
  var colCount = function (k, s) { return D.projects.filter(function (p) { return cell(p, k)[0] === s; }).length; };
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  var mem = function (k, v) { try { if (v === undefined) return localStorage.getItem('review-' + k); localStorage.setItem('review-' + k, v); } catch (e) { return null; } };
  var st = function (s) { return el('span', GLYPH[s] + ' ' + WORD[s], 'st ' + cls(s)); };
  var pri = function (n) { return el('span', PGLYPH[n] + ' ' + PRI[n], 'st p' + n); };
  var days = function (p) { return p.git && p.git.last ? Math.floor((D.generated - Date.parse(p.git.last)) / 864e5) : null; };
  var ago = function (d) { return d == null ? '' : d < 1 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
  var leaksOf = function (p) { return D.leaks[p.dir] || []; };
  var GROUPS = []; D.projects.forEach(function (p) { if (GROUPS.indexOf(p.group) < 0) GROUPS.push(p.group); }); GROUPS.sort();
  var allTasks = []; D.projects.forEach(function (p) { p.tasks.forEach(function (t) { allTasks.push({ p: p, t: t }); }); });

  // small builders shared by the tabs
  function select(opts, value, onPick, aria) {

    s.value = value; s.addEventListener('change', function () { onPick(s.value); }); return s;
  }
  function groupSelect(value, onPick) { return select([['', 'Every group']].concat(GROUPS.map(function (g) { return [g, g]; })), value, onPick, 'Group'); }
  function searchBox(ph, onType) { var s = el('input'); s.type = 'search'; s.placeholder = ph; s.setAttribute('aria-label', ph); s.addEventListener('input', function () { onType(s.value.toLowerCase()); }); return s; }
  function chips(list, isOn, onTap) { // list: [[id, text]]; returns { els, paint }
    var els = {}; list.forEach(function (c) { var b = el('button', c[1], 'chip'); b.addEventListener('click', function () { onTap(c[0]); }); els[c[0]] = b; });
    return { els: els, paint: function () { Object.keys(els).forEach(function (k) { els[k].setAttribute('aria-pressed', String(isOn(k))); }); } };
  }
  function stackBar(f, w, o, title) {
    var bar = el('div', null, 'bar'), n = f + w + o || 1; bar.title = title;
    [['f', f], ['w', w], ['o', o]].forEach(function (x) { if (x[1]) { var i = el('i', null, x[0]); i.style.width = (100 * x[1] / n) + '%'; bar.appendChild(i); } });
    return bar;
  }
  function sortableTable(cols, rows, state, redraw) { // cols: [[key, heading]]; rows: [{ key: text|node, _sort: { key: value } }]
    var t = el('table', null, 'plain'), h = el('tr');
    cols.forEach(function (c) {
      var th = el('th', c[1] + (state.by === c[0] ? (state.dir > 0 ? ' ▲' : ' ▼') : '')); if (state.by === c[0]) th.className = 'sorted';
      th.title = 'Sort by ' + c[1].toLowerCase();
      th.addEventListener('click', function () { state.dir = state.by === c[0] ? -state.dir : 1; state.by = c[0]; redraw(); }); h.appendChild(th);
    });
    var th0 = el('thead'); th0.appendChild(h); t.appendChild(th0);
    var tb = el('tbody');
    rows.slice().sort(function (a, b) { var x = a._sort[state.by], y = b._sort[state.by]; return (x < y ? -1 : x > y ? 1 : 0) * state.dir; }).forEach(function (r) {
      var tr = el('tr'); cols.forEach(function (c) { var td = el('td'); var v = r[c[0]]; if (v && v.nodeType) td.appendChild(v); else td.textContent = v == null ? '' : v; if (r._nowrap && r._nowrap.indexOf(c[0]) >= 0) td.className = 'nowrap'; tr.appendChild(td); });
      tb.appendChild(tr);

    t.appendChild(tb); return t;
  }
  function copy(text, btn) {
    var done = function () { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallback(); }); else fallback();
    function fallback() { var a = el('textarea'); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { /* nothing more to try */ } a.remove(); }
  }
  // the text to paste into an app's own session
  function brief(p) {
    var lines = ['Review notes for ' + p.title + ' (' + new Date(D.generated).toLocaleDateString() + '), from the QA lead\'s review page.', ''];
    if (!p.tasks.length) lines.push('Nothing is open against the house standards.');
    [1, 2, 3, 4].forEach(function (n) {
      var ts = p.tasks.filter(function (t) { return t.pri === n; }); if (!ts.length) return;
      lines.push({ 1: 'Urgent:', 2: 'Gaps to close, in this order:', 3: 'Loose ends:', 4: 'Someday:' }[n]);
      ts.forEach(function (t) { lines.push('- ' + t.text); }); lines.push('');
    });
    lines.push('Check with: node ../CoworkSyncHub/standards.mjs ' + (p.registered ? p.slug.toLowerCase() : '--dir .') + ' -v');
    return lines.join('\n');
  }

  // ---- the detail panel ----
  function panel(title, build) { $('panel').hidden = false; $('panel').querySelector('h3').textContent = title; var b = $('panelBody'); b.textContent = ''; build(b); }
  $('panel').querySelector('.x').addEventListener('click', function () { $('panel').hidden = true; });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') $('panel').hidden = true; });
  function showCell(p, k) {
    var c = cell(p, k);
    panel(p.title + ' · ' + k, function (b) {
      b.appendChild(el('p', label[k], 'dim')); b.appendChild(st(c[0]));
      if (c[1]) b.appendChild(el('p', c[1]));
      var row = el('p'), a = el('button', 'Open project', 'chip'), s = el('button', 'Open standard', 'chip');
      a.addEventListener('click', function () { go('projects', p.slug); }); s.addEventListener('click', function () { go('standards', k); });
      row.append(a, ' ', s); b.appendChild(row);
    });
  }

  // ---- tabs ----
  var TABS = [['overview', 'Overview'], ['todo', 'To do'], ['matrix', 'Matrix'], ['projects', 'Projects'], ['standards', 'Standards'], ['leaks', 'Leaks'], ['overlaps', 'Overlaps'], ['roadmap', 'Roadmap and decisions']];
  var built = {}, focus = null, BUILD = {};
  function go(tab, target) {
    focus = target || null;
    TABS.forEach(function (t) { $('t-' + t[0]).hidden = t[0] !== tab; $('nav').querySelector('[data-tab=' + t[0] + ']').setAttribute('aria-selected', String(t[0] === tab)); });
    if (!built[tab] || focus) { $('t-' + tab).textContent = ''; BUILD[tab]($('t-' + tab)); built[tab] = true; }
    if (focus) { var d = document.getElementById(tab + '-' + focus); if (d) { if ('open' in d) d.open = true; else if (d.parentNode && 'open' in d.parentNode) d.parentNode.open = true; d.scrollIntoView({ block: 'start' }); window.scrollBy(0, -100); } }
    try { history.replaceState(null, '', '#' + tab + (focus ? '/' + focus : '')); } catch (e) { /* file:// in some browsers */ }

  }
  var totalFail = 0, totalWarn = 0;
  D.projects.forEach(function (p) { totalFail += count(p, 'FAIL'); totalWarn += count(p, 'warn'); });
  var leakTotal = 0; Object.keys(D.leaks).forEach(function (k) { leakTotal += D.leaks[k].length; });
  var doNow = allTasks.filter(function (x) { return x.t.pri <= 2; }).length;
  var badge = { todo: doNow, matrix: totalFail, projects: D.projects.length, standards: D.standards.length, leaks: leakTotal, overlaps: D.overlaps.length };
  TABS.forEach(function (t) {
    var b = el('button', t[1]); b.dataset.tab = t[0]; b.setAttribute('role', 'tab');
    if (badge[t[0]] != null) b.appendChild(el('span', String(badge[t[0]]), 'n'));
    b.addEventListener('click', function () { go(t[0]); }); $('nav').appendChild(b);
  });
  $('when').textContent = 'generated ' + new Date(D.generated).toLocaleString() + (D.quick ? ' (quick: no CI, live or GitHub lookups)' : '') + ' · local file, not published';

  // ---- overview ----
  BUILD.overview = function (box) {
    var dirty = D.projects.filter(function (p) { return p.git && (p.git.dirty || p.git.unpushed); });
    var ciBad = D.projects.filter(function (p) { return p.ci === 'FAIL'; }), down = D.projects.filter(function (p) { return p.live && p.live !== '200' && p.live !== '-'; });
    var outside = allTasks.filter(function (x) { return x.t.source === 'GitHub' && x.t.pri === 2; }).length;
    var prev = D.prev, tiles = el('div', null, 'tiles');
    [[D.projects.length, 'projects', '', 'projects'], [doNow, 'to-dos that are urgent or a gap', doNow ? 'bad' : 'ok', 'todo', prev && prev.tasks],
      [totalFail, 'failing checks', totalFail ? 'bad' : 'ok', 'matrix', prev && prev.fail], [totalWarn, 'warnings', totalWarn ? 'mid' : 'ok', 'matrix', prev && prev.warn],
      [leakTotal, 'leak findings', leakTotal ? 'bad' : 'ok', 'leaks', prev && prev.leaks], [ciBad.length + down.length, 'failing CI or sites down', ciBad.length + down.length ? 'bad' : 'ok', 'projects'],
      [dirty.length, 'repos with uncommitted or unpushed work', dirty.length ? 'mid' : 'ok', 'projects'], [outside, 'outside pull requests or issues unanswered', outside ? 'mid' : 'ok', 'todo']].forEach(function (t) {
      var b = el('button', null, 'tile ' + t[2]); b.appendChild(el('b', String(t[0]))); b.appendChild(el('span', t[1]));
      if (t[4] != null) { var dlt = t[0] - t[4]; b.appendChild(el('span', dlt === 0 ? 'no change since the last run' : (dlt > 0 ? '▲ ' + dlt + ' more' : '▼ ' + (-dlt) + ' fewer') + ' since the last run', 'delta ' + (dlt > 0 ? 'up' : dlt < 0 ? 'down' : ''))); }
      b.addEventListener('click', function () { go(t[3]); }); tiles.appendChild(b);
    });
    box.appendChild(tiles);
    var cols = el('div', null, 'cols');
    // next task per project
    var c0 = el('div', null, 'card wide'); c0.appendChild(el('h3', 'Next task for each project'));
    var state0 = { by: 'pri', dir: 1 };
    var host0 = el('div', null, 'wrap'); host0.style.maxHeight = '330px'; c0.appendChild(host0);
    (function draw() {
      var rows = D.projects.map(function (p) {
        var t = p.tasks[0], nb = el('button', p.title, 'link'); nb.addEventListener('click', function () { go('projects', p.slug); });
        return { project: nb, pri: t ? pri(t.pri) : el('span', '✓ clear', 'st ok'), next: p.next || 'Nothing open', open: String(p.tasks.filter(function (x) { return x.pri <= 2; }).length), last: ago(days(p)),
          _nowrap: ['project', 'pri', 'last'], _sort: { project: p.title.toLowerCase(), pri: t ? t.pri : 9, next: (p.next || '').toLowerCase(), open: -p.tasks.filter(function (x) { return x.pri <= 2; }).length, last: days(p) == null ? 1e9 : days(p) } };
      });
      host0.textContent = ''; host0.appendChild(sortableTable([['project', 'Project'], ['pri', 'Priority'], ['next', 'Next task'], ['open', 'Urgent + gaps'], ['last', 'Last commit']], rows, state0, draw));
    })();
    cols.appendChild(c0);
    var c1 = el('div', null, 'card'); c1.appendChild(el('h3', 'Projects by gaps'));
    var bars = el('div', null, 'bars');
    D.projects.slice().sort(function (a, b) { return count(b, 'FAIL') - count(a, 'FAIL') || count(b, 'warn') - count(a, 'warn'); }).forEach(function (p) {

    box.appendChild(el('p', D.neverList ? 'Your private never-publish list is in use (' + plural(D.neverList, 'string') + ').' : 'No private never-publish list yet (~/.adervec-runner/never-publish.txt).', 'dim small'));
  };

  // ---- overlaps ----
  BUILD.overlaps = function (box) {
    var stt = 'all', q = '', app = '', state = { by: 'state', dir: 1 }, tools = el('div', null, 'tools');
    var ch = chips(['all', 'planned', 'idea', 'done', 'dropped'].map(function (s) { return [s, (s === 'all' ? 'Everything' : s) + ' (' + (s === 'all' ? D.overlaps.length : D.overlaps.filter(function (o) { return o.state === s; }).length) + ')']; }),
      function (k) { return k === stt; }, function (k) { stt = k; draw(); });
    Object.keys(ch.els).forEach(function (k) { tools.appendChild(ch.els[k]); });
    tools.append(el('span', null, 'sep'), select([['', 'Every project']].concat(D.projects.map(function (p) { return [p.title, p.title]; })), '', function (v) { app = v; draw(); }, 'Project'), searchBox('Filter by word…', function (v) { q = v; draw(); }));
    box.appendChild(tools);
    box.appendChild(el('p', 'Noticed, not decided (house standard 27). Nothing here is being built unless its state is "planned".', 'dim small'));
    var w = el('div', null, 'wrap'); box.appendChild(w);
    var order = { planned: 0, idea: 1, done: 2, dropped: 3 };
    function draw() {
      ch.paint();
      var rows = D.overlaps.filter(function (o) { return (stt === 'all' || o.state === stt) && (!app || o.who.indexOf(app) >= 0 || o.source === app) && (!q || (o.who + ' ' + o.what).toLowerCase().indexOf(q) >= 0); })
        .map(function (o, i) { return { state: o.state, who: o.who, what: o.what, by: o.source, _nowrap: ['state'], _sort: { state: order[o.state] * 1000 + i, who: o.who.toLowerCase(), what: o.what.toLowerCase(), by: o.source.toLowerCase() + String(1000 + i) } }; });
      w.textContent = ''; w.appendChild(rows.length ? sortableTable([['state', 'State'], ['who', 'Who'], ['what', 'What overlaps, and what could be shared'], ['by', 'Noted by']], rows, state, draw) : el('p', 'Nothing matches.', 'empty'));
    }
    draw();
  };

  // ---- roadmap and decisions ----
  BUILD.roadmap = function (box) {
    var N = D.notes;
    box.appendChild(el('h2', 'Hub roadmap'));
    var t = el('table', null, 'plain'), tb = el('tbody');
    (N.roadmap || []).forEach(function (r) { var tr = el('tr'); tr.appendChild(el('td', r[0])); var s = el('td'); s.className = 'nowrap'; s.appendChild(el('span', r[1], 'tag ' + (r[1] === 'done' ? 'ok' : r[1] === 'blocked' ? 'bad' : r[1] === 'in progress' ? 'mid' : ''))); tr.appendChild(s); tr.appendChild(el('td', r[2])); tb.appendChild(tr); });
    t.appendChild(tb); var w = el('div', null, 'wrap'); w.style.maxHeight = 'none'; w.appendChild(t); box.appendChild(w);
    [['Decisions waiting on you', N.decisions], ['Waiting on you (actions)', N.waiting], ['Decided', N.decided], ['Not yet tried by a person', N.untested]].forEach(function (g) {
      box.appendChild(el('h2', g[0] + ' (' + (g[1] || []).length + ')')); var ul = el('ul', null, 'todo'); (g[1] || []).forEach(function (x) { ul.appendChild(el('li', x)); });
      if (!ul.children.length) ul.appendChild(el('li', 'Nothing recorded.', 'dim')); box.appendChild(ul);
    });
    box.appendChild(el('p', 'This tab is kept by the QA lead session in _review/notes.json; the other tabs are read from the repos each time the page is generated.', 'dim small'));
  };

  var h = (location.hash || '#overview').slice(1).split('/');
  go(TABS.some(function (t) { return t[0] === h[0]; }) ? h[0] : 'overview', h[1]);
})();
</script>
</body></html>
